<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Roadpal</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#FFF9F0" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#14181B" media="(prefers-color-scheme: dark)">
    <meta name="description" content="Plan the stops around your family on the road.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Roadpal">
    <meta property="og:title" content="Roadpal">
    <meta property="og:description" content="Plan the stops around your family on the road.">
    <meta property="og:url" content="https://roadpal.botoros.se/">
    <meta property="og:locale" content="en_US">
    <meta property="og:locale:alternate" content="sv_SE">
    <meta property="og:image" content="https://roadpal.botoros.se/og-image.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Roadpal">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="maplibre-gl.css">
    <link rel="stylesheet" href="roadpal.css">
    <style>
        body { margin: 0; font: 16px/1.4 system-ui, sans-serif; }
        header { padding: 12px 16px; }
        header h1 { margin: 0 0 4px; font-size: 1.3rem; }
        header p { margin: 0 0 4px; }
        #map { width: 100%; height: 45vh; }
        section { padding: 0 16px; }
        section h2 { font-size: 1.1rem; margin: 12px 0 4px; }
        section form, section label, section div { margin-bottom: 4px; }
        section label > span, section fieldset > span { margin-right: 0.4em; }
        section label { margin-right: 0.8em; }
        section fieldset > span { display: block; font-weight: bold; margin-top: 4px; }
        section fieldset label { display: inline-block; }
        section fieldset button { display: block; margin-top: 4px; }
        section input[type="number"] { width: 5em; }
        section div > strong { display: block; margin-top: 4px; }
        #notice { font-size: 0.85rem; }
        button[aria-pressed="true"] { font-weight: bold; }
        #more-options summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; }
        .map-toggle { min-height: var(--target); padding: 0 var(--space-4); background: none; border: 0; color: var(--primary); font: inherit; text-decoration: underline; cursor: pointer; }
        body > button.map-toggle:not([hidden]) { display: block; margin-left: auto; margin-right: var(--space-4); }
        .error { color: var(--danger); margin: 4px 0; }
        .stop-marker { width: 28px; height: 28px; padding: 0; border-radius: 50%; border: 2px solid var(--surface); background: var(--primary); color: var(--on-primary); font: bold 14px system-ui, sans-serif; cursor: pointer; }
        .pause-marker { background: var(--text); color: var(--background); }
        .stop-marker[aria-current="true"] { outline: 3px solid var(--accent); outline-offset: 1px; }
        .busy::after { content: ""; display: inline-block; width: 0.8em; height: 0.8em; margin-left: 0.5em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -0.1em; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { .busy::after { display: none; } }
        @media (min-width: 1024px) {
            body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
            body > script { display: none; }
            body > header, body > section { grid-column: 1; }
            body > button.map-toggle:not([hidden]) { grid-column: 2; grid-row: 1 / span 20; justify-self: end; align-self: start; position: sticky; top: 0; z-index: 1; margin: var(--space-2); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
            #map { grid-column: 2; grid-row: 1 / span 20; position: sticky; top: 0; height: 100vh; }
        }
    </style>
</head>
<body>
<script type="module" src="webApp.js"></script>
</body>
</html>
